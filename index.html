<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enjoy the silence.</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(circle at 18% 22%, rgba(90, 40, 80, 0.28), transparent 32%),
      radial-gradient(circle at 82% 68%, rgba(70, 30, 60, 0.24), transparent 36%),
      linear-gradient(160deg, #1a1a1a 0%, #201a20 55%, #16161a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  /* faint horizontal scanline texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.014) 0 1px,
      transparent 1px 3px
    );
    pointer-events: none;
  }

  /* two distant light points */
  .star {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 8px 3px rgba(255, 255, 255, 0.35);
    pointer-events: none;
  }
  .star.a { top: 16%; left: 12%; }
  .star.b { top: 48%; right: 14%; }

  .card {
    text-align: center;
    width: fit-content;
    max-width: min(92vw, 640px);
    padding: 52px 64px;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.018));
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 60px rgba(255, 255, 255, 0.03);
  }

  h1 {
    margin: 0 0 20px;
    font-family: Georgia, "Times New Roman", "Playfair Display", serif;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 3.4rem);
    color: #f0f0f0;
    letter-spacing: 0.01em;
  }

  p {
    margin: 0;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    color: #6f9dee;
    font-weight: 400;
  }
</style>
</head>
<body>
  <span class="star a"></span>
  <span class="star b"></span>
  <div class="card">
    <h1>Enjoy the silence.</h1>
    <p>a quiet phlegmatic, exploring and building in the dark</p>
  </div>
</body>
</html>
